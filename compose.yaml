# Локальный учебный стек. Для публичного сервера нужны HTTPS и production settings.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: backend_lab
      POSTGRES_USER: backend_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backend_lab -d backend_lab"]
      interval: 3s
      timeout: 3s
      retries: 20
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
      POSTGRES_DB: backend_lab
      POSTGRES_USER: backend_lab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media_data:/app/media
    # Для одного локального web-контейнера. В production миграции — отдельный шаг deploy.
    command: sh -c "python manage.py migrate --noinput && gunicorn ronaldu.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
volumes:
  postgres_data:
  media_data:
