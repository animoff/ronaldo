name: Django checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: backend_lab
          POSTGRES_USER: backend_lab
          POSTGRES_PASSWORD: ephemeral-ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U backend_lab -d backend_lab"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_DB: ${{ matrix.database == 'postgres' && 'backend_lab' || '' }}
      POSTGRES_USER: backend_lab
      POSTGRES_PASSWORD: ephemeral-ci-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py seed_demo
      - run: python manage.py seed_demo
      - run: python manage.py test --verbosity 2
      - run: python manage.py collectstatic --noinput
      - name: Production configuration checks
        run: |
          export SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')"
          DEBUG=0 python manage.py check --deploy --fail-level WARNING
